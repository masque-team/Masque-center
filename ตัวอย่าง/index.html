.pass-meta{font-size:10px;line-height:1.4;margin-top:3px}
.pass-panel>.gold-btn{font-size:12px;padding:10px 11px;border-radius:13px}
.pass-features{grid-column:1/-1;grid-row:2;padding-left:0;padding-top:11px;border-left:0;border-top:1px solid #e5ebf5;gap:8px;justify-content:space-between}
.metric{min-width:0;flex:1}
.metric b{font-size:15px;white-space:nowrap}
.metric small{font-size:9px;line-height:1.25}
.section{margin-top:23px}
.section-title{margin-bottom:12px}
.section-title h2{font-size:20px}
.section-title p{font-size:10px;line-height:1.45}
.pill-action{font-size:11px;padding:7px 9px}
.game-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.game-card{border-radius:17px;min-width:0}
.game-card:hover{transform:none}
.card-art{height:130px}
.sticker{font-size:9px;left:8px;top:8px;padding:4px 7px}
.game-info{padding:11px 10px;gap:3px}
.game-info h3{font-size:15px;line-height:1.16}
.game-info p{font-size:10px;line-height:1.4}
.go-circle{width:29px;height:29px;flex-shrink:0;border-radius:10px;font-size:18px}
.ranking-preview{grid-template-columns:1fr;gap:12px}
.rank-list{padding:6px 15px}
.rank-row{padding:11px 0}
.rank-side{padding:21px;border-radius:20px}
.rank-side h3{font-size:20px}
.rank-side p{font-size:12px}
.foot-note{font-size:10px;line-height:1.5;margin-top:25px}
.bottom-nav{display:flex!important;position:fixed;bottom:0;left:50%;right:auto;transform:translateX(-50%);width:min(100%,var(--portrait-width));z-index:50;justify-content:space-around;padding:9px 10px max(9px,env(safe-area-inset-bottom,0px));background:#fffefbf5;border-top:1px solid #d4e3f8;box-shadow:0 -6px 22px #35588d24;backdrop-filter:blur(14px)}
.bottom-nav button{border:0;background:none;color:#7587a4;display:grid;place-items:center;gap:1px;font-size:10px;padding:2px 22px;font-weight:600;min-height:40px}
.bottom-nav button strong{font-size:21px;line-height:1.2}
.bottom-nav button.active{color:#216fce}
.pass-hero{margin:18px auto 20px}
.pass-hero .crown{font-size:43px}
.pass-hero h1{font-size:26px;line-height:1.22}
.pass-hero p{font-size:12px;line-height:1.6}
.plan-grid{grid-template-columns:1fr;gap:14px}
.plan{padding:23px 20px;border-radius:22px}
.plan h2{font-size:23px}
.price .big{font-size:51px}
.free-band{flex-direction:column;align-items:stretch;gap:13px;padding:18px}
.free-band strong{font-size:17px}
.free-band p{font-size:12px}
.free-band button{width:100%}
.full-rank-grid{grid-template-columns:1fr;gap:13px}
.rank-summary{padding:18px}
.demo-label{white-space:nowrap}
.game-page{width:100%;height:100dvh;min-height:100dvh;max-height:100dvh;overflow:hidden;display:flex;flex-direction:column;background:#dceaff}
.game-topbar{width:100%;padding:calc(9px + env(safe-area-inset-top,0px)) 10px 8px;gap:7px;min-height:68px;flex:0 0 auto;flex-wrap:nowrap}
.back-home{padding:9px 10px;border-radius:11px;font-size:12px;flex-shrink:0}
.back-home span{display:none}
.game-top-title{flex:1;min-width:0;overflow:hidden}
.game-top-title b{font-size:14px;line-height:1.2}
.game-top-title small{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.game-metrics{gap:4px;flex-shrink:0}
.game-metric{border-radius:10px;padding:6px 8px}
.game-metric small{font-size:8px}
.game-metric b{font-size:13px}
.game-metric.mobile-hide{display:none}
.game-mini-bar{padding:6px 9px;gap:6px;font-size:10px;flex-wrap:nowrap;min-height:38px}
.game-mini-bar>.spacer{min-width:0}
.game-mini-bar>span:last-of-type{display:none}
.game-mini-bar .free-time{white-space:nowrap;font-size:10px}
.mini-link{padding:5px 6px;font-size:10px;white-space:nowrap}
.game-host{flex:1 1 0;min-height:0!important;height:auto;overflow:hidden;position:relative}
.game-host iframe{width:100%;height:100%;position:absolute;inset:0;border:0;display:block}
.game-loading{padding:20px}
.game-loading b{font-size:19px}
.game-loading p{font-size:12px}
.modal-layer{left:50%;right:auto;width:min(100%,var(--portrait-width));transform:translateX(-50%);padding:13px}
.modal{width:100%;max-height:calc(100dvh - 26px);padding:23px 18px;border-radius:24px}
.modal h2{font-size:23px}
.modal-actions{gap:7px}
.modal-actions button{padding:12px 9px;font-size:13px;white-space:normal}
.toast-area{bottom:calc(74px + env(safe-area-inset-bottom,0px));max-width:calc(min(100vw,var(--portrait-width)) - 24px)}
.toast{white-space:normal;text-align:center}
/* Real mobile landscape cannot be OS-locked from an ordinary myAIS WebView. Prompt rotation instead. */
#portrait-notice{display:none;position:fixed;inset:0;z-index:99999;background:linear-gradient(145deg,#122557,#1f70b5);color:#fff;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:'Kanit',sans-serif}
#portrait-notice .notice-box{max-width:350px}
#portrait-notice .rotate-icon{font-size:52px;margin-bottom:12px}
#portrait-notice strong{font-size:23px}
#portrait-notice p{font-size:14px;line-height:1.7;color:#d9eaff}
@media (orientation:landscape) and (max-height:550px) and (pointer:coarse){#portrait-notice{display:flex}}
@media(min-width:431px){#app{border-radius:27px 27px 0 0}}
@media(max-width:355px){.shell{padding-left:10px;padding-right:10px}.brand{font-size:19px}.hero h1{font-size:21px}.game-info h3{font-size:14px}.pass-panel{gap:7px}.game-top-title small{display:none}.game-mini-bar{font-size:9px}}

</style>
</head>

  const STORAGE='masquegame_portal_demo_v1';
  const SAMPLE_RANK=[{name:'Aomsin',score:15320},{name:'SkyLuna',score:12480},{name:'WinnyZ',score:10950},{name:'Momo',score:9120},{name:'Kiki',score:8640}];
  const DAILY_FREE_SECONDS=60*60,DAY_MS=24*60*60*1000;
  const TODAY=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
  const INITIAL=()=>({points:320,passUntil:0,freeDate:TODAY(),freeUsed:0,playerName:'Demo Player',playerId:'MG10248',level:18,scores:{bird:47,mole:1250,run:640,fruit:780,timber:320,duck:520}});
  let state=INITIAL();try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&typeof saved==='object')state={...state,...saved,scores:{...state.scores,...(saved.scores||{})}}}catch{}
  let activeGame=null,playInterval=null,playCounter=0;
  const app=document.getElementById('app'),overlay=document.getElementById('overlay');
  function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch{}}
  function syncDaily(){if(state.freeDate!==TODAY()){state.freeDate=TODAY();state.freeUsed=0;persist()}}
  function validPass(){return Number(state.passUntil)>Date.now()}
  function freeLeft(){syncDaily();return Math.max(0,DAILY_FREE_SECONDS-state.freeUsed)}
  function totalScore(){return Object.values(state.scores).reduce((a,b)=>a+(Number(b)||0),0)}
  function dateTime(ms){return new Date(ms).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
  function remaining(ms){let t=Math.max(0,ms-Date.now());const days=Math.floor(t/DAY_MS),h=Math.floor((t%DAY_MS)/3600000),m=Math.ceil((t%3600000)/60000);return days?`${days} วัน ${h} ชม.`:`${h} ชม. ${m} นาที`}
  function fmt(x){return Number(x||0).toLocaleString('en-US')}
  function toast(s){const root=document.getElementById('toast-area'),div=document.createElement('div');div.className='toast';div.textContent=s;root.append(div);setTimeout(()=>div.remove(),3000)}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function titleBar(page){return `<header class="topbar"><a href="#home" class="brand"><span class="brand-icon">🎮</span><span>Masque<span>Game</span></span></a><nav class="desktop-nav" aria-label="หน้าหลัก"><button class="nav-link ${page==='home'?'active':''}" data-go="home">หน้าหลัก</button><button class="nav-link ${page==='pass'?'active':''}" data-go="pass">Masque Pass</button><button class="nav-link ${page==='ranking'?'active':''}" data-go="ranking">อันดับผู้เล่น</button></nav><div class="account"><div class="account-pill" title="AIS Points จำลอง"><span class="point-icon">AIS</span><div><small style="color:#8795b1;display:block;line-height:1">AIS Points</small><strong>${fmt(state.points)}</strong></div></div><div class="profile-dot" title="Player ID ${esc(state.playerId)}">${state.level}</div></div></header>`}
  function bottomNav(page){return `<nav class="bottom-nav" aria-label="เมนูด้านล่าง"><button class="${page==='home'?'active':''}" data-go="home"><strong>⌂</strong>Home</button><button class="${page==='pass'?'active':''}" data-go="pass"><strong>🎫</strong>Pass</button><button class="${page==='ranking'?'active':''}" data-go="ranking"><strong>🏆</strong>Ranking</button></nav>`}
  function mount(page,content){app.innerHTML=`<div class="shell">${titleBar(page)}${content}<div class="foot-note">MasqueGame UX Prototype • ข้อมูล AIS Points, คะแนน, ผู้เล่น และ Pass เป็นข้อมูลจำลองในเบราว์เซอร์ ไม่ได้ตัดแต้มจริง</div></div>${bottomNav(page)}`;setupPosterFallbacks();scrollTo(0,0)}
  function setupPosterFallbacks(){
   for(const img of app.querySelectorAll('img[data-remote-thumb]')){
    img.addEventListener('error',()=>{
      const stage=Number(img.dataset.stage||0);
      if(stage===0){img.dataset.stage='1';img.src=img.dataset.remoteThumb;}
      else if(stage===1){img.dataset.stage='2';img.src=img.dataset.fallbackThumb;}
      else {img.dataset.stage='3';img.style.visibility='hidden';}
    });
   }
  }
  function passPanel(){const on=validPass();return `<section class="pass-panel glass-panel ${on?'active':'free'}"><div class="pass-profile"><div class="pass-emblem">${on?'👑':'🎫'}</div><div><strong>${on?'Masque Pass':'Free Player'} <span class="status-tag ${on?'vip':'off'} ${on?'on':''}">${on?'PASS ACTIVE':'สายฟรี'}</span></strong><div class="pass-meta">${on?`ใช้งานได้อีก ${remaining(state.passUntil)} • เล่นได้ทุกเกมแบบพรีเมียม`:`เหลือเวลาเล่นฟรีวันนี้ ${Math.ceil(freeLeft()/60)} นาที • ไม่นับอันดับ`}</div></div></div><div class="pass-features"><div class="metric"><b>LV.${state.level}</b><small>Player Level (Demo)</small></div><div class="metric"><b>${esc(state.playerId)}</b><small>Player ID</small></div><div class="metric"><b>${fmt(totalScore())}</b><small>คะแนนตัวอย่างรวม</small></div></div><button class="${on?'gold-btn':'primary-btn'}" data-go="pass">${on?'ต่ออายุ Pass':'ซื้อ Masque Pass'} <span>›</span></button><div class="pass-highlight ${on?'on':'off'}"><span>${on?'👑 สิทธิ์ Masque Pass':'🎮 สิทธิ์สายฟรี'}</span><b>${on?'Rank เปิดใช้งาน • เล่นได้ไม่จำกัด • โปรไฟล์ดูพรีเมียม':'เล่นฟรีวันละ 60 นาที • คะแนนจะไม่ถูกนับเข้า Rank'}</b></div></section>`}
  function gameCards(){const on=validPass();return `<div class="game-grid">${GAMES.map(g=>`<button class="game-card ${on?'pass-on':'pass-off'}" data-game="${g.id}" data-id="${g.id}" aria-label="เข้าเกม ${esc(g.name)}"><div class="card-art"><img src="images/${g.poster}" data-remote-thumb="${g.thumb}" data-fallback-thumb="${EMBEDDED_IMAGES[g.id]}" alt="ภาพประกอบ ${esc(g.name)}" loading="lazy"><span class="sticker">✦ ${g.badge}</span><span class="access-tag ${on?'on':'off'}">${on?'Rank On':'Free Play'}</span></div><div class="game-info"><div><h3>${g.name}</h3><p>${g.thai}</p><span class="game-mode ${on?'on':'off'}">${on?'👑 เล่นแบบ Pass / มีสิทธิ์ Rank':'🎮 เล่นฟรี / ไม่นับ Rank'}</span></div><span class="go-circle">›</span></div></button>`).join('')}</div>`}
  function home(){const on=validPass();mount('home',`<section class="hero"><div class="hero-content"><div class="eyebrow">WELCOME TO MASQUEGAME</div><h1>${on?'Masque Pass พร้อมลุย!':'เลือกเกมที่ชอบ'}<br>${on?'วันนี้พร้อมไต่แรงก์แล้ว':'ทำคะแนนท้าชิงอันดับ!'}</h1><p>${on?'ตอนนี้คุณอยู่ในโหมดพรีเมียม เล่นได้ทุกเกมไม่จำกัด พร้อมสิทธิ์เข้า Rank':'6 เกมพร้อมเล่น • แข่งทำ High Score • มีทั้งสายฟรีและ Masque Pass'}</p><div class="hero-chips"><span>🎮 เกม HTML5 ผ่าน iframe</span><span>${on?'👑 Pass Active':'⏱️ ฟรีวันละ 1 ชม.'}</span><span>🏆 ${on?'Rank พร้อมใช้งาน':'Pass เปิดสิทธิ Rank'}</span></div></div><div class="hero-art">${on?'👑':'🏆'}</div></section>${passPanel()}<section class="section"><div class="section-title"><div><h2>🎮 เลือกเกมที่อยากเล่น</h2><p>${on?'ทุกเกมพร้อมเล่นแบบพรีเมียม • การ์ดที่มี Pass จะดูโดดเด่นขึ้น':'กดการ์ดเพื่อเปิดเกมจริงใน MasqueGame'}</p></div><span class="demo-label">ทั้งหมด ${GAMES.length} เกม</span></div>${gameCards()}</section><section class="section"><div class="section-title"><div><h2>🏆 อันดับผู้เล่น</h2><p>ตัวอย่างผู้เล่นและคะแนน • สำหรับผู้ถือ Pass เท่านั้น</p></div><button class="pill-action" data-go="ranking">ดูทั้งหมด →</button></div><div class="ranking-preview"><div class="glass-panel rank-list">${SAMPLE_RANK.slice(0,3).map((r,i)=>rankItem(r,i+1)).join('')}</div><div class="glass-panel rank-side"><h3>${on?'คุณพร้อมท้าชิงอันดับ!':'ฟรีก็สนุกได้ แต่ยังไม่นับ Rank'}</h3><p>${on?'คะแนนของคุณสามารถเข้าร่วมการจัดอันดับเมื่อเชื่อมระบบเกม':'สมัคร Masque Pass เพื่อปลดล็อกการเข้าร่วม Leaderboard และเล่นได้เต็มวัน'}</p><button class="soft-btn" data-go="${on?'ranking':'pass'}">${on?'ดูอันดับ':'ดูแพ็กเกจ Pass'} →</button></div></div></section>`)}
  function rankItem(player,i){return `<div class="rank-row"><span class="rank-position ${i===1?'first':''}">${i===1?'🥇':i===2?'🥈':i===3?'🥉':'#'+i}</span><div class="rank-person">${esc(player.name)}<div class="rank-sub">คะแนนรวม (ตัวอย่าง)</div></div><div class="rank-score">${fmt(player.score)}</div></div>`}
  function passPage(){const on=validPass();mount('pass',`<div class="pass-hero"><div class="crown">👑</div><div class="eyebrow" style="color:#527cca">MASQUE PASS</div><h1>เล่นเกมได้เต็มที่<br>ลุยอันดับได้ทุกวัน</h1><p>เลือก Pass ด้วย AIS Points • ไม่มี Energy • เปิดได้ทุกเกมในแคตตาล็อก</p>${on?`<div style="margin-top:14px"><span class="status-tag on" style="font-size:13px">Pass ปัจจุบันหมดอายุ ${dateTime(state.passUntil)}</span></div>`:''}</div><div class="plan-grid"><section class="plan glass-panel"><div class="plan-label">DAILY PASS</div><h2>🎟️ Pass 1 วัน</h2><div class="price"><span class="big">1</span><strong>AIS Point</strong></div><div class="plan-desc">เหมาะสำหรับลองแข่งคะแนนวันนี้</div><ul><li><span class="check">✓</span> เล่นทุกเกมได้ตลอด 24 ชั่วโมง</li><li><span class="check">✓</span> คะแนนมีสิทธิ์นับเข้า Rank*</li><li><span class="check">✓</span> ไม่จำกัดเวลาเล่นระหว่าง Pass</li></ul><button class="primary-btn" data-buy="1">แลก Pass 1 วัน →</button></section><section class="plan popular glass-panel"><div class="popular-flag">คุ้มที่สุด</div><div class="plan-label">WEEKLY PASS</div><h2>🏆 Pass 7 วัน</h2><div class="price"><span class="big">5</span><strong>AIS Points</strong></div><div class="plan-desc">เหมาะสำหรับสายแข่ง High Score</div><ul><li><span class="check">✓</span> เล่นทุกเกมได้ตลอด 7 วัน</li><li><span class="check">✓</span> คะแนนมีสิทธิ์นับเข้า Rank*</li><li><span class="check">✓</span> ไม่จำกัดเวลาเล่นระหว่าง Pass</li></ul><button class="gold-btn" data-buy="7">แลก Pass 7 วัน →</button></section></div><div class="free-band glass-panel"><div><strong>🎮 ยังไม่อยากซื้อ? เล่นแบบสายฟรีได้</strong><p>เล่นฟรีรวมทุกเกมได้วันละ 60 นาที • คะแนนไม่เข้าการจัดอันดับ • เหลือวันนี้ ${Math.ceil(freeLeft()/60)} นาที</p></div><button class="soft-btn" data-go="home">เล่นแบบสายฟรี →</button></div><div class="fineprint">* การนับอันดับต้องเชื่อมต่อระบบคะแนนที่ตรวจสอบความถูกต้องจาก Backend ก่อน จึงจะใช้งานจริงได้ • ตัวอย่างนี้จำลองการใช้ AIS Points และการต่ออายุ Pass ใน LocalStorage เท่านั้น • ซื้อ Pass ซ้อนจะต่อเวลาเพิ่มจากวันหมดอายุเดิม</div>`)}
  function ranking(){const on=validPass();mount('ranking',`<div class="section-title" style="margin-top:24px"><div><h2>🏆 Leaderboard</h2><p>อันดับผู้เล่นทั้งหมด • คะแนนและชื่อเป็นข้อมูลจำลอง</p></div><span class="demo-label">DEMO DATA</span></div><div class="full-rank-grid"><div class="glass-panel full-rank">${SAMPLE_RANK.map(rankItem).join('')}<div class="empty-rank">${on?'✅ คุณมี Pass และมีสิทธิ์ส่งคะแนนเพื่อเข้าร่วม Rank เมื่อเชื่อม Backend แล้ว':'🔒 สายฟรีเล่นได้ แต่คะแนนจะไม่ถูกบันทึกเข้า Rank'}</div></div><div class="glass-panel rank-summary"><strong>${on?'คุณมีสิทธิ์ร่วม Rank':'ปลดล็อก Ranked Play'}</strong><p>${on?'Masque Pass กำลังใช้งาน':'เล่นฟรีวันละ 1 ชั่วโมงได้ตามปกติ แต่ Rank สำหรับผู้มี Pass'}</p><div class="big">${on?'✓':'🔒'}</div><p>คะแนนรวมตัวอย่างของคุณ: ${fmt(totalScore())} คะแนน<br>นี่ไม่ใช่อันดับจริงจาก Server</p><button class="${on?'soft-btn':'gold-btn'}" data-go="${on?'home':'pass'}" style="width:100%">${on?'กลับไปเล่นเกม':'ซื้อ Masque Pass'}</button></div></div>`)}
  function modal(inner){overlay.innerHTML=`<div class="modal-layer" data-overlay-close="1"><div class="modal" role="dialog" aria-modal="true"><button class="modal-close" data-close="1" aria-label="ปิด">×</button>${inner}</div></div>`}
  function closeModal(){overlay.innerHTML=''}
  function buyModal(days){const cost=days===1?1:5;const enough=state.points>=cost;modal(`<div class="modal-emoji">🎫</div><h2>ยืนยันการแลก Pass</h2><p>Masque Pass ${days} ${days===1?'วัน':'วัน'}<br>เล่นได้ทุกเกม ไม่จำกัดชั่วโมง และมีสิทธิ์เข้า Rank</p><div class="detail"><div class="detail-line"><span>จำนวนวัน</span><b>${days} วัน</b></div><div class="detail-line"><span>AIS Points ที่มี (จำลอง)</span><b>${fmt(state.points)}</b></div><div class="detail-line total"><span>ใช้ AIS Points</span><b>🟢 ${cost} Points</b></div></div>${enough?'<div class="info-callout">การตัด AIS Points ในต้นแบบเป็นการจำลองเท่านั้น ไม่มีการเชื่อมต่อ AIS จริง</div>':'<div class="info-callout warn">AIS Points ตัวอย่างไม่เพียงพอสำหรับแพ็กเกจนี้</div>'}<div class="modal-actions"><button class="soft-btn" data-close="1">ยกเลิก</button><button class="gold-btn" data-confirm-buy="${days}" ${enough?'':'disabled'}>ยืนยันแลก Pass</button></div>`)}
  function buy(days){const cost=days===1?1:5;if(state.points<cost)return toast('AIS Points ไม่เพียงพอ');state.points-=cost;state.passUntil=Math.max(Date.now(),Number(state.passUntil)||0)+days*DAY_MS;persist();closeModal();passPage();toast(`แลก Masque Pass ${days} วันสำเร็จ (จำลอง)`)}
  function launchModal(g){const on=validPass(),left=Math.ceil(freeLeft()/60);modal(`<div class="modal-emoji">🎮</div><h2>${esc(g.name)}</h2><p>${esc(g.thai)}<br>เกมจะเปิดใน iframe ภายใน MasqueGame</p><div class="detail"><div class="detail-line"><span>รูปแบบการเข้าเล่น</span><b>${on?'👑 Masque Pass':'⏱️ Free Play'}</b></div><div class="detail-line"><span>เวลาเล่นคงเหลือ</span><b>${on?remaining(state.passUntil)+' (ไม่จำกัดรายวัน)':left+' นาที วันนี้'}</b></div><div class="detail-line"><span>Rank</span><b>${on?'มีสิทธิ์เมื่อเชื่อมคะแนนจริง':'ไม่นับคะแนน'}</b></div><div class="detail-line"><span>Best Score</span><b>${fmt(state.scores[g.id])} (ตัวอย่าง)</b></div></div>${!on&&freeLeft()<=0?'<div class="info-callout warn">ใช้เวลาเล่นฟรีครบ 60 นาทีวันนี้แล้ว ซื้อ Pass เพื่อเล่นต่อ หรือรอวันถัดไป</div>':'<div class="info-callout">เมื่อออกจากเกม เวลาสายฟรีจะหยุดนับ • คะแนนจริงยังต้องเชื่อม API</div>'}<div class="modal-actions"><button class="soft-btn" data-close="1">ยกเลิก</button><button class="green-btn" data-launch="${g.id}" ${!on&&freeLeft()<=0?'disabled':''}>▶ เริ่มเล่น</button></div>${!on&&freeLeft()<=0?'<button class="gold-btn" data-go="pass" style="width:100%;margin-top:10px">ซื้อ Pass เล่นต่อ →</button>':''}`)}
  function stopGame(){if(playInterval){clearInterval(playInterval);playInterval=null}if(activeGame){persist();activeGame=null;playCounter=0}}
  function play(g){closeModal();stopGame();activeGame=g;const on=validPass();app.innerHTML=`<div class="game-page"><header class="game-topbar"><button class="back-home" data-go="home">← <span>Home</span></button><div class="game-top-title"><b>🎮 ${esc(g.name)}</b><small>MasqueGame • ${esc(state.playerId)} • LV.${state.level}</small></div><div class="game-metrics"><div class="game-metric"><small>คะแนนสูงสุด (ตัวอย่าง)</small><b id="game-score">${fmt(state.scores[g.id])}</b></div><div class="game-metric mobile-hide"><small>Rank</small><b>${on?'Eligible':'Free / ไม่คิด'}</b></div></div></header><div class="game-mini-bar"><span>${on?'👑 Pass Active':'⏱️ Free Play'}</span><strong id="free-clock" class="free-time">${on?'เล่นได้ไม่จำกัด':formatSecs(freeLeft())+' เหลือ'}</strong><span class="spacer"></span><span>หากเกมไม่แสดง:</span><a class="mini-link" href="${g.url}" target="_blank" rel="noopener noreferrer">เปิดเกมแท็บใหม่ ↗</a></div><div class="game-host" id="game-host"><div class="game-loading" id="game-loading"><div><div class="spinner"></div><b>กำลังเปิด ${esc(g.name)}</b><p>โหลดเกมจริงจาก masque-lab.adldigitalservice.com</p></div></div><iframe id="play-frame" src="${g.url}" title="${esc(g.name)}" allow="autoplay; fullscreen; gamepad" allowfullscreen loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe></div></div>`;
   const frame=document.getElementById('play-frame');frame.addEventListener('load',()=>{const el=document.getElementById('game-loading');if(el)el.remove()},{once:true});
   // Free-mode countdown is a browser-only UX simulation; the production quota must be enforced by the backend.
   playCounter=0;playInterval=setInterval(()=>{if(!activeGame||document.hidden)return;if(validPass())return;syncDaily();state.freeUsed=Math.min(DAILY_FREE_SECONDS,state.freeUsed+1);playCounter++;let clock=document.getElementById('free-clock');if(clock)clock.textContent=formatSecs(freeLeft())+' เหลือ';if(playCounter%5===0)persist();if(freeLeft()<=0){stopGame();frame.remove();const host=document.getElementById('game-host');if(host)host.innerHTML='<div style="margin:auto;text-align:center;padding:24px"><div style="font-size:65px">⏰</div><h2>ครบเวลาเล่นฟรีวันนี้แล้ว</h2><p>ซื้อ Masque Pass เพื่อเล่นต่อและเข้าร่วม Rank</p><button class="gold-btn" data-go="pass">ดูแพ็กเกจ Pass →</button><button class="soft-btn" data-go="home" style="margin-left:9px">กลับ Home</button></div>';persist()}},1000);
   scrollTo(0,0)
  }
  function formatSecs(s){let m=Math.floor(s/60),sec=Math.floor(s%60);return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
  function route(){stopGame();closeModal();const r=location.hash.replace(/^#/,'').split('/')[0]||'home';if(r==='pass')passPage();else if(r==='ranking')ranking();else home()}
  function goto(r){if(location.hash==='#'+r)route();else location.hash=r}
  // Explicit integration hook: child game needs to postMessage score; not implemented by the linked games today.
  window.addEventListener('message',e=>{if(!activeGame||!e.source||!document.getElementById('play-frame'))return;if(e.source!==document.getElementById('play-frame').contentWindow||e.origin!==new URL(activeGame.url).origin)return;let m=e.data;if(!m||m.type!=='MASQUE_GAME_SCORE'||m.gameId!==activeGame.id)return;const score=Number(m.score);if(!Number.isFinite(score)||score<0||score>1e9)return;state.scores[activeGame.id]=Math.max(state.scores[activeGame.id]||0,Math.floor(score));persist();const t=document.getElementById('game-score');if(t)t.textContent=fmt(state.scores[activeGame.id]);toast('ได้รับคะแนนจากเกม (ยังไม่ใช่ Ranked Score ที่ Server ตรวจสอบ)')});
  document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-game],[data-buy],[data-confirm-buy],[data-launch],[data-close],[data-overlay-close]');if(!b)return;if(b.dataset.overlayClose&&e.target!==b)return;if(b.dataset.close||b.dataset.overlayClose)return closeModal();if(b.dataset.go)return goto(b.dataset.go);if(b.dataset.game){const g=GAMES.find(x=>x.id===b.dataset.game);if(g)launchModal(g);return}if(b.dataset.buy)return buyModal(Number(b.dataset.buy));if(b.dataset.confirmBuy)return buy(Number(b.dataset.confirmBuy));if(b.dataset.launch){const g=GAMES.find(x=>x.id===b.dataset.launch);if(g)play(g)}});
  window.addEventListener('hashchange',route);window.addEventListener('beforeunload',persist);document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
  syncDaily();route();
  </script>
</body>
</html>
